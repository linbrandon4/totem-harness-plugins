name: Publish MCP Registry metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@v5
      - name: Install signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify official publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL "$base/$archive" -o "$archive"
          curl -fsSL "$base/$archive.sigstore.json" -o "$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate metadata
        run: ./mcp-publisher validate
      - name: Authenticate using this repository's GitHub identity
        run: ./mcp-publisher login github-oidc
      - name: Publish remote server metadata
        run: ./mcp-publisher publish
